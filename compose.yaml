# Local stack: docker compose up -d --build   →   http://localhost:${FRONTEND_PORT} (default 8081)
# Config comes from .env (cp .env.example .env). Never commit .env.

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # $$ = read the variables inside the container, not from compose.
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  accounts-api:
    build: services/accounts-api
    image: payflow/accounts-api:dev
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@postgres:5432/${POSTGRES_DB:?}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      postgres:
        condition: service_healthy
    # Override the image's check: /readyz (database reachable) instead of /healthz,
    # and a short start_interval so dependants don't wait 30 s for the first check.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/readyz', timeout=2)"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 20s
      start_interval: 2s

  payments-api:
    build: services/payments-api
    image: payflow/payments-api:dev
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@postgres:5432/${POSTGRES_DB:?}
      ACCOUNTS_API_URL: http://accounts-api:8001
      REDIS_URL: redis://redis:6379/0
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      accounts-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/readyz', timeout=2)"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 20s
      start_interval: 2s

  notification-worker:
    build: services/notification-worker
    image: payflow/notification-worker:dev
    environment:
      REDIS_URL: redis://redis:6379/0
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # HOSTNAME (the consumer name) is set by Docker to the container ID.
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      start_period: 20s
      start_interval: 2s

  frontend:
    build: frontend
    image: payflow/frontend:dev
    # Stands in for the Kubernetes Ingress: routes /api/* to the APIs by service name.
    volumes:
      - ./frontend/dev/nginx.compose.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${FRONTEND_PORT:-8081}:8080"
    depends_on:
      accounts-api:
        condition: service_healthy
      payments-api:
        condition: service_healthy
    healthcheck:
      start_period: 20s
      start_interval: 2s

volumes:
  pgdata:
