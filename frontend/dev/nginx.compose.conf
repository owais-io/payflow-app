# docker compose only: mounted over the image's default.conf. Serves the page and
# stands in for the Kubernetes Ingress, routing /api/* to the APIs by compose service
# name and stripping the /api prefix, exactly as the Ingress will.
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    # Look service names up in Docker's embedded DNS at request time, not once at
    # startup. A restarted container can come back with a new IP, and a stopped one
    # should give a fast 502 instead of a request hanging on its old IP.
    # (proxy_pass only re-resolves when its target is a variable, hence the "set" lines.)
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 2s;
    proxy_connect_timeout 2s;

    # The image HEALTHCHECK calls this.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # /api/accounts/123/balance -> http://accounts-api:8001/accounts/123/balance
    location /api/accounts {
        set $accounts_api http://accounts-api:8001;
        rewrite ^/api(/.*)$ $1 break;
        proxy_pass $accounts_api;
    }

    # /api/payments?account_id=... -> http://payments-api:8002/payments?account_id=...
    location /api/payments {
        set $payments_api http://payments-api:8002;
        rewrite ^/api(/.*)$ $1 break;
        proxy_pass $payments_api;
    }
}
