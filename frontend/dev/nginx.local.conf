# Local development only: serves the page and stands in for the Kubernetes Ingress,
# routing /api/accounts and /api/payments to the APIs running on this machine and
# stripping the /api prefix, exactly as the Ingress will. Not used in the container image.
#
# Run from the frontend/ folder (needs --network host so nginx can reach 127.0.0.1:8001/8002):
#   docker run --rm --name payflow-frontend --network host \
#     -v "$PWD":/usr/share/nginx/html:ro \
#     -v "$PWD/dev/nginx.local.conf":/etc/nginx/conf.d/default.conf:ro \
#     nginxinc/nginx-unprivileged:1.27-alpine
# Then open http://localhost:8080

server {
    listen 8080;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    location = /dev/nginx.local.conf {
        return 404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # /api/accounts/123/balance -> http://127.0.0.1:8001/accounts/123/balance
    location /api/accounts {
        rewrite ^/api(/.*)$ $1 break;
        proxy_pass http://127.0.0.1:8001;
    }

    # /api/payments?account_id=... -> http://127.0.0.1:8002/payments?account_id=...
    location /api/payments {
        rewrite ^/api(/.*)$ $1 break;
        proxy_pass http://127.0.0.1:8002;
    }
}
